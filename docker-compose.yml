services:

  postgres:
    image: postgres:17
    container_name: customers-postgres

    environment:
      POSTGRES_DB: users-app-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

#    ports:
#      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users-app-db"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:latest
    container_name: customers-redis

#    ports:
#      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: customers-app

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users-app-db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy


volumes:
  postgres-data: